<form hx-post="/api/search" 
      hx-target="#results-content" 
      hx-swap="innerHTML"
      hx-ext="json-enc"
      hx-trigger="submit"
      x-data="{ 
          expandNicknames: true, 
          includeTrigramSimilarity: false, 
          includePhonetic: false,
          viewType: 'list',
          suggestions: [],
          showSuggestions: false,
          selectedIndex: -1,
          async fetchSuggestions(query) {
              if (!query || query.length < 2) {
                  this.suggestions = [];
                  this.showSuggestions = false;
                  return;
              }
              try {
                  const response = await fetch(`/api/suggestions?prefix=${encodeURIComponent(query)}&limit=10`);
                  this.suggestions = await response.json();
                  this.showSuggestions = this.suggestions.length > 0;
                  this.selectedIndex = -1;
              } catch (error) {
                  console.error('Failed to fetch suggestions:', error);
                  this.suggestions = [];
                  this.showSuggestions = false;
              }
          },
          selectSuggestion(name) {
              document.getElementById('query_name').value = name;
              this.suggestions = [];
              this.showSuggestions = false;
              this.selectedIndex = -1;
          },
          handleKeydown(event) {
              if (!this.showSuggestions) return;
              
              if (event.key === 'ArrowDown') {
                  event.preventDefault();
                  this.selectedIndex = Math.min(this.selectedIndex + 1, this.suggestions.length - 1);
              } else if (event.key === 'ArrowUp') {
                  event.preventDefault();
                  this.selectedIndex = Math.max(this.selectedIndex - 1, -1);
              } else if (event.key === 'Enter' && this.selectedIndex >= 0) {
                  event.preventDefault();
                  this.selectSuggestion(this.suggestions[this.selectedIndex]);
              } else if (event.key === 'Escape') {
                  this.suggestions = [];
                  this.showSuggestions = false;
                  this.selectedIndex = -1;
              }
          }
      }"
      class="space-y-6">
    
    <!-- Row 1: Name to Search and Max Results -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Name to Search -->
        <div class="relative">
            <label for="query_name" class="block text-sm font-medium text-gray-700 mb-2">
                <span class="flex items-center">
                    <svg class="w-4 h-4 mr-1" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z"></path>
                    </svg>
                    Name to Search
                </span>
            </label>
            <input type="text" 
                   id="query_name" 
                   name="query_name"
                   required
                   placeholder="Type a name to see suggestions"
                   class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition"
                   autocomplete="off"
                   @input.debounce.300ms="fetchSuggestions($event.target.value)"
                   @keydown="handleKeydown($event)"
                   @blur="setTimeout(() => { showSuggestions = false }, 200)">
            <p class="text-xs text-gray-500 mt-1">Type a name to see suggestions</p>
            
            <!-- Suggestions Dropdown -->
            <div x-show="showSuggestions" 
                 x-transition
                 class="absolute z-50 w-full mt-1 bg-white border border-gray-300 rounded-lg shadow-lg max-h-64 overflow-y-auto">
                <template x-for="(suggestion, index) in suggestions" :key="index">
                    <div @click="selectSuggestion(suggestion)"
                         :class="{'bg-cyan-50': selectedIndex === index, 'hover:bg-gray-50': selectedIndex !== index}"
                         class="px-4 py-2.5 cursor-pointer border-b border-gray-100 last:border-b-0 transition">
                        <span x-text="suggestion" class="text-gray-800"></span>
                    </div>
                </template>
            </div>
        </div>

        <!-- Max Results -->
        <div>
            <label for="max_results" class="block text-sm font-medium text-gray-700 mb-2">
                Max Results
            </label>
            <input type="number" 
                   id="max_results" 
                   name="max_results"
                   value="50"
                   min="1"
                   max="200"
                   step="1"
                   class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition">
            <p class="text-xs text-gray-500 mt-1">List view only</p>
        </div>
    </div>

    <!-- Row 2: Min Similarity -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Min Similarity -->
        <div>
            <label for="min_similarity" class="block text-sm font-medium text-gray-700 mb-2">
                Min Similarity (%)
            </label>
            <input type="number" 
                   id="min_similarity" 
                   name="min_similarity_threshold"
                   value="50"
                   min="0"
                   max="100"
                   step="5"
                   class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition">
            <p class="text-xs text-gray-500 mt-1">0% - 100%</p>
        </div>

        <div></div>
    </div>

    <!-- Row 3: County Filter and Record Type -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- County Filter -->
        <div>
            <label for="county_id" class="block text-sm font-medium text-gray-700 mb-2">
                <span class="flex items-center">
                    <svg class="w-4 h-4 mr-1" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"></path>
                    </svg>
                    County Filter
                </span>
            </label>
            <select id="county_id" 
                    name="county_id"
                    class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition">
                <option value="">(All Counties)</option>
            </select>
        </div>

        <!-- Record Type Filter -->
        <div>
            <label for="record_type" class="block text-sm font-medium text-gray-700 mb-2">
                <span class="flex items-center">
                    <svg class="w-4 h-4 mr-1" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M7 3a1 1 0 000 2h6a1 1 0 100-2H7zM4 7a1 1 0 011-1h10a1 1 0 110 2H5a1 1 0 01-1-1zM2 11a2 2 0 012-2h12a2 2 0 012 2v4a2 2 0 01-2 2H4a2 2 0 01-2-2v-4z"></path>
                    </svg>
                    Record Type
                </span>
            </label>
            <select id="record_type" 
                    name="record_type"
                    class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition">
                <option value="">(All Types)</option>
                <option value="I">Individual</option>
                <option value="B">Business</option>
                <option value="U">Unknown</option>
            </select>
        </div>
    </div>

    <!-- Match Strategy Filters -->
    <div class="border-t border-gray-200 pt-4">
        <label class="block text-sm font-medium text-gray-700 mb-3">
            Match Strategies <span class="text-xs text-gray-500">(Exact always included)</span>
        </label>
        <div class="flex flex-wrap gap-6">
            <!-- Nickname Strategy -->
            <label class="flex items-center space-x-2 cursor-pointer">
                <input type="checkbox" 
                       name="expand_nicknames"
                       x-model="expandNicknames"
                       checked
                       class="w-5 h-5 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                <span class="flex items-center space-x-2">
                    <svg class="w-5 h-5 text-blue-600" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z"></path>
                    </svg>
                    <span class="text-sm font-medium text-gray-700">Nickname</span>
                </span>
            </label>

            <!-- Fuzzy Strategy (Trigram) -->
            <label class="flex items-center space-x-2 cursor-pointer">
                <input type="checkbox" 
                       name="include_trigram_similarity"
                       x-model="includeTrigramSimilarity"
                       class="w-5 h-5 text-cyan-600 border-gray-300 rounded focus:ring-cyan-500">
                <span class="flex items-center space-x-2">
                    <svg class="w-5 h-5 text-cyan-600" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM7 9a1 1 0 000 2h6a1 1 0 100-2H7z" clip-rule="evenodd"></path>
                    </svg>
                    <span class="text-sm font-medium text-gray-700">Fuzzy</span>
                </span>
            </label>

            <!-- Phonetic Strategy -->
            <label class="flex items-center space-x-2 cursor-pointer">
                <input type="checkbox" 
                       name="include_phonetic"
                       x-model="includePhonetic"
                       class="w-5 h-5 text-orange-600 border-gray-300 rounded focus:ring-orange-500">
                <span class="flex items-center space-x-2">
                    <svg class="w-5 h-5 text-orange-600" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M7 4a3 3 0 016 0v4a3 3 0 11-6 0V4zm4 10.93A7.001 7.001 0 0017 8a1 1 0 10-2 0A5 5 0 015 8a1 1 0 00-2 0 7.001 7.001 0 006 6.93V17H6a1 1 0 100 2h8a1 1 0 100-2h-3v-2.07z" clip-rule="evenodd"></path>
                    </svg>
                    <span class="text-sm font-medium text-gray-700">Phonetic</span>
                </span>
            </label>
        </div>
    </div>

    <!-- Submit and Clear Buttons -->
    <div class="flex justify-center gap-4 pt-2">
        <button type="submit"
                class="px-8 py-3 bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-semibold rounded-lg shadow-lg hover:shadow-xl transform hover:scale-105 transition duration-200">
            <span class="flex items-center space-x-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                          d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
                <span>Search</span>
            </span>
        </button>
        <button type="button"
                onclick="this.form.reset(); document.getElementById('results-container').classList.add('hidden'); document.getElementById('empty-state').classList.remove('hidden');"
                class="px-8 py-3 bg-white border-2 border-gray-300 text-gray-700 font-semibold rounded-lg hover:bg-gray-50 transition duration-200">
            <span class="flex items-center space-x-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                          d="M6 18L18 6M6 6l12 12"></path>
                </svg>
                <span>Clear</span>
            </span>
        </button>
    </div>
</form>

<script>
// Load counties on page load
document.addEventListener('DOMContentLoaded', async function() {
    try {
        const response = await fetch('/api/counties');
        const counties = await response.json();
        const select = document.getElementById('county_id');
        
        counties.forEach(county => {
            const option = document.createElement('option');
            option.value = county.county_id;
            option.textContent = `${county.county_name} (${county.county})`;
            select.appendChild(option);
        });
    } catch (error) {
        console.error('Failed to load counties:', error);
    }
});
</script>
